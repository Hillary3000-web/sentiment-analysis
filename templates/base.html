<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SentimentIQ | By Hillary Chukwuma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b110e;
      --surface: #0e1612;
      --card: #131c16;
      --border: #203126;
      --text: #f0fdf4;
      --muted: #839d8c;
      --accent-pos: #a5f921;
      --accent-neg: #ff4466;
      --accent-neutral: #2dd4bf;
      
      --font-display: 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Premium Noise Overlay */
    .noise {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Dynamic Mouse Glow */
    .mouse-glow {
      position: fixed;
      top: 0; left: 0;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 0;
      transition: opacity 0.3s;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0; width: 100%;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: rgba(7, 7, 9, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 28px;
      font-style: italic;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0%; height: 1px;
      background: var(--text);
      transition: width 0.3s ease;
    }

    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }

    /* Page Transitions */
    main {
      flex: 1;
      position: relative;
      z-index: 10;
      margin-top: 100px;
      padding: 0 24px 64px;
      opacity: 0;
      transform: translateY(12px);
      animation: page-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes page-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Typography */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(48px, 8vw, 84px);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    h1 em {
      font-style: italic;
      color: var(--accent-pos);
    }

    h2 {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 20px;
    }

    p {
      color: var(--muted);
      font-size: 17px;
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(165, 249, 33, 0.05);
      border: 1px solid rgba(165, 249, 33, 0.2);
      color: var(--accent-pos);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 32px;
      text-transform: uppercase;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 24px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }

    @media (max-width: 768px) {
      nav { padding: 20px 24px; flex-direction: column; gap: 16px; }
      .nav-links { gap: 20px; }
      main { margin-top: 120px; }
    }
    
    /* Shared Premium Styles */
    .glass-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      transition: border-color 0.4s;
    }
    .glass-card:hover {
      border-color: rgba(255,255,255,0.15);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="noise"></div>
  <div class="mouse-glow" id="mouseGlow"></div>

  <nav>
    <a href="/" class="nav-logo">SentimentIQ</a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Analyzer</a>
      <a href="/architecture" class="nav-link {% if request.path == '/architecture' %}active{% endif %}">Architecture</a>
      <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">About Me</a>
    </div>
  </nav>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>
    Designed & Engineered by Hillary Chukwuma Prince &nbsp;•&nbsp; CSC 309 Project
  </footer>

  <script>
    // Mouse Glow Effect
    const glow = document.getElementById('mouseGlow');
    window.addEventListener('mousemove', (e) => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
